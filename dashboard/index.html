<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Tool Portal</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --bg2: #1a1a1a;
      --bg3: #222;
      --text: #e0e0e0;
      --text2: #888;
      --border: #2a2a2a;
      --up: #22c55e;
      --warn: #eab308;
      --down: #444;
      --accent: #6366f1;
      --section-header: #1e1e1e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px 24px; }
    h1 { font-size: 1.2rem; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
    .controls { margin-bottom: 20px; display: flex; gap: 10px; align-items: center; }
    button { padding: 6px 14px; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.82rem; }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #last-updated { font-size: 0.78rem; color: var(--text2); }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #444; border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Section headers */
    .section-header {
      font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text2); padding: 10px 4px 8px;
      border-bottom: 1px solid var(--border); margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
    }
    .section-header .count { background: var(--bg3); padding: 1px 7px; border-radius: 10px; font-size: 0.7rem; }
    .section-header.collapsed .count { background: var(--text2); color: var(--bg); }
    .section-body { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-bottom: 24px; }
    .section-body.collapsed { display: none; }

    /* Tool cards */
    .card {
      background: var(--bg2); border-radius: 10px; border: 1px solid var(--border);
      padding: 14px 16px; transition: border-color 0.2s;
    }
    .card:hover { border-color: #444; }
    .card.up { border-left: 3px solid var(--up); }
    .card.warning { border-left: 3px solid var(--warn); }
    .card.down { border-left: 3px solid var(--down); }

    .card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .card-icon { font-size: 1.2rem; }
    .card-name { font-weight: 600; font-size: 0.9rem; flex: 1; }
    .status-badge {
      font-size: 0.65rem; font-weight: 600; padding: 2px 7px; border-radius: 8px;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .status-badge.up { background: #1a3a1a; color: var(--up); }
    .status-badge.warning { background: #3a2e0a; color: var(--warn); }
    .status-badge.down { background: #2a2a2a; color: var(--text2); }

    .card-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
    .meta-item { display: flex; flex-direction: column; gap: 1px; }
    .meta-label { font-size: 0.65rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.05em; }
    .meta-value { font-size: 0.8rem; font-family: 'SF Mono', 'Consolas', monospace; color: var(--text); }
    .meta-value.empty { color: var(--text2); }

    .card-footer { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); display: flex; gap: 6px; }
    .btn-sm { padding: 4px 10px; font-size: 0.75rem; border-radius: 5px; border: none; cursor: pointer; background: var(--bg3); color: var(--text); }
    .btn-sm:hover { background: #333; }
    .btn-sm.start { background: #1a3a1a; color: var(--up); }
    .btn-sm.stop { background: #3a1a1a; color: #ef4444; }
    .btn-sm:disabled { opacity: 0.3; cursor: not-allowed; }

    .loading { text-align: center; padding: 40px; color: var(--text2); }
    .error-box { background: #1f1f1f; border: 1px solid #333; border-radius: 8px; padding: 14px; color: #ef4444; font-size: 0.85rem; margin-bottom: 16px; display: none; }

    .toast {
      position: fixed; bottom: 20px; right: 20px; background: var(--bg2);
      border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px;
      font-size: 0.82rem; max-width: 300px; z-index: 999;
      animation: slideIn 0.2s ease;
    }
    .toast.ok { border-left: 3px solid var(--up); }
    .toast.err { border-left: 3px solid #ef4444; }
    @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
  </style>
</head>
<body>
  <h1>
    <span id="title-icon">🛠️</span>
    AI Tool Portal
    <span id="total-badge" style="font-size:0.75rem;background:var(--bg2);padding:2px 8px;border-radius:8px;color:var(--text2)">—</span>
  </h1>

  <div class="controls">
    <button id="refresh-btn" onclick="fetchAll()">↻ Refresh</button>
    <span id="last-updated">—</span>
    <span id="loading-spinner" class="spinner" style="display:none"></span>
  </div>

  <div id="error-box" class="error-box"></div>

  <div id="sections"></div>

  <!-- Confirmation modal -->
  <div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;align-items:center;justify-content:center;">
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:320px;width:90%;">
      <div id="modal-title" style="font-weight:600;font-size:1rem;margin-bottom:10px;"></div>
      <div id="modal-body" style="color:var(--text2);font-size:0.85rem;margin-bottom:20px;"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button onclick="closeModal()" style="background:var(--bg3);">Cancel</button>
        <button id="modal-confirm-btn" onclick="confirmAction()" style="background:#6366f1;">Confirm</button>
      </div>
    </div>
  </div>

<script>
const API = '/api/plugins/ai-tool-portal';
let tools = [];
let healthCache = {};
let pendingAction = null;
let refreshTimer = null;

// ── Fetch ───────────────────────────────────────────────────────

async function fetchAll() {
  showLoading(true);
  hideError();
  try {
    const [toolsRes, healthRes] = await Promise.all([
      fetch(`${API}/tools`),
      Promise.all(tools.map(t => fetch(`${API}/tools/${t.id}/health`).then(r => r.json()).catch(() => ({tool_id: t.id, status: 'down', port_listening: false, pid: null, rss_mb: null, uptime_s: null, version: null}))))
    ]);
    if (!toolsRes.ok) throw new Error(`HTTP ${toolsRes.status}`);
    tools = await toolsRes.json();
    healthCache = {};
    healthRes.forEach(h => { healthCache[h.tool_id] = h; });
    render();
    document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch(err) {
    showError('Failed to load: ' + err.message);
  } finally {
    showLoading(false);
  }
}

function showLoading(v) {
  document.getElementById('loading-spinner').style.display = v ? 'inline-block' : 'none';
  document.getElementById('refresh-btn').disabled = v;
}

// ── Render ──────────────────────────────────────────────────────

function render() {
  const running = tools.filter(t => healthCache[t.id]?.status === 'up' || healthCache[t.id]?.status === 'warning');
  const stopped = tools.filter(t => healthCache[t.id]?.status === 'down');

  // Sort running: highest uptime first (most "established" services on top)
  running.sort((a, b) => {
    const aU = healthCache[a.id]?.uptime_s || 0;
    const bU = healthCache[b.id]?.uptime_s || 0;
    return bU - aU;
  });
  // Sort stopped: alphabetical
  stopped.sort((a, b) => a.name.localeCompare(b.name));

  const totalUp = running.filter(t => healthCache[t.id]?.status === 'up').length;

  document.getElementById('total-badge').textContent = `${totalUp}/${tools.length} up`;

  const sectionsEl = document.getElementById('sections');
  sectionsEl.innerHTML = '';

  if (running.length) {
    sectionsEl.appendChild(makeSection('running', `Running (${running.length})`, running));
  }
  if (stopped.length) {
    sectionsEl.appendChild(makeSection('stopped', `Stopped (${stopped.length})`, stopped));
  }

  // Restore collapsed state from localStorage
  restoreCollapsedState();
}

function makeSection(id, label, toolList) {
  const section = document.createElement('div');
  const header = document.createElement('div');
  header.className = 'section-header';
  header.onclick = () => {
    const body = section.querySelector('.section-body');
    const isCollapsed = body.classList.toggle('collapsed');
    header.classList.toggle('collapsed', isCollapsed);
    // Save to localStorage
    const collapsed = JSON.parse(localStorage.getItem('ai-tool-portal:collapsed') || '[]');
    if (isCollapsed) { collapsed.push(id); } else { collapsed.splice(collapsed.indexOf(id), 1); }
    localStorage.setItem('ai-tool-portal:collapsed', JSON.stringify(collapsed));
  };
  header.innerHTML = `<span>▼</span> ${label} <span class="count">${toolList.length}</span>`;

  const body = document.createElement('div');
  body.className = 'section-body';
  toolList.forEach(t => body.appendChild(makeCard(t)));

  section.appendChild(header);
  section.appendChild(body);
  return section;
}

function makeCard(tool) {
  const h = healthCache[tool.id] || {};
  const status = h.status || 'down';
  const portOk = h.port_listening;
  const isRunning = status === 'up' || status === 'warning';

  const card = document.createElement('div');
  card.className = `card ${status}`;
  card.id = `card-${tool.id}`;

  const metaItems = [
    { label: 'Port', value: tool.default_port, show: true },
    { label: 'PID', value: h.pid || '—', show: true },
    { label: 'RSS', value: h.rss_mb != null ? h.rss_mb.toFixed(1) + ' MB' : '—', show: isRunning },
    { label: 'Uptime', value: fmtUptime(h.uptime_s), show: isRunning },
    { label: 'Version', value: h.version || '—', show: true },
  ];

  const version = h.version ? `<div class="meta-item"><div class="meta-label">Version</div><div class="meta-value ${h.version ? '' : 'empty'}">${h.version || '—'}</div></div>` : '';
  const uptimeStr = h.uptime_s != null ? fmtUptime(h.uptime_s) : '—';
  const rssStr = h.rss_mb != null ? h.rss_mb.toFixed(1) + ' MB' : '—';
  const pidStr = h.pid || '—';

  card.innerHTML = `
    <div class="card-header">
      <span class="card-icon">${tool.icon || '⚙️'}</span>
      <span class="card-name">${tool.name}</span>
      <span class="status-badge ${status}">${status}</span>
    </div>
    <div class="card-meta">
      <div class="meta-item"><div class="meta-label">Port</div><div class="meta-value">${tool.default_port}</div></div>
      <div class="meta-item"><div class="meta-label">PID</div><div class="meta-value ${pidStr === '—' ? 'empty' : ''}">${pidStr}</div></div>
      <div class="meta-item"><div class="meta-label">RSS</div><div class="meta-value ${rssStr === '—' ? 'empty' : ''}">${rssStr}</div></div>
      <div class="meta-item"><div class="meta-label">Uptime</div><div class="meta-value ${uptimeStr === '—' ? 'empty' : ''}">${uptimeStr}</div></div>
    </div>
    <div class="card-footer" id="actions-${tool.id}">
      <button class="btn-sm start" onclick="doAction('${tool.id}', 'start')" ${isRunning ? 'disabled' : ''}>▶ Start</button>
      <button class="btn-sm stop" onclick="doAction('${tool.id}', 'stop')" ${isRunning ? '' : 'disabled'}>■ Stop</button>
      <button class="btn-sm" onclick="doAction('${tool.id}', 'restart')" ${isRunning ? '' : 'disabled'}>↻ Restart</button>
    </div>
  `;
  return card;
}

function fmtUptime(s) {
  if (s == null || s < 0) return '—';
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s/60) + 'm';
  if (s < 86400) return (s/3600).toFixed(1) + 'h';
  return (s/86400).toFixed(1) + 'd';
}

// ── Actions ─────────────────────────────────────────────────────

function doAction(toolId, action) {
  const tool = tools.find(t => t.id === toolId);
  if (!tool) return;
  pendingAction = { toolId, action, tool };
  openModal(tool, action);
}

function openModal(tool, action) {
  const warnings = {
    start: `Start ${tool.name}?`,
    stop: `Stop ${tool.name}? This may interrupt active workflows.`,
    restart: `Restart ${tool.name}? This will briefly disconnect all active sessions.`
  };
  document.getElementById('modal-title').textContent = warnings[action] || `${action} ${tool.name}?`;
  document.getElementById('modal-body').textContent = 'Click Confirm to proceed.';
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('modal-confirm-btn').textContent = action === 'restart' ? 'Yes, restart' : 'Confirm';
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
  pendingAction = null;
}

async function confirmAction() {
  if (!pendingAction) return;
  const { toolId, action, tool } = pendingAction;
  closeModal();

  // Disable buttons during action
  const actionsEl = document.getElementById(`actions-${toolId}`);
  if (actionsEl) {
    actionsEl.querySelectorAll('button').forEach(b => b.disabled = true);
  }

  try {
    const res = await fetch(`${API}/tools/${toolId}/action`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, confirm: true })
    });
    const result = await res.json();
    showToast(result.ok ? `✅ ${tool.name} ${action}ed` : `❌ ${result.stderr || 'Action failed'}`, result.ok ? 'ok' : 'err');
    // Refresh after 2s
    setTimeout(fetchAll, 2000);
  } catch(e) {
    showToast(`❌ ${e.message}`, 'err');
  }
}

function showToast(msg, type='ok') {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 5000);
}

function showError(msg) {
  const el = document.getElementById('error-box');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideError() {
  document.getElementById('error-box').style.display = 'none';
}

// ── Collapsed state ─────────────────────────────────────────────

function restoreCollapsedState() {
  const collapsed = JSON.parse(localStorage.getItem('ai-tool-portal:collapsed') || '[]');
  collapsed.forEach(id => {
    const header = document.querySelector(`.section-header`);
    const allSections = document.querySelectorAll('.section-header');
    allSections.forEach(h => {
      // Match by section id in the onclick context — use DOM traversal
      const section = h.closest('[id]') || h.parentElement;
    });
  });
  // Simpler approach: read the collapsed list and apply classes
  document.querySelectorAll('.section-header').forEach(h => {
    const span = h.querySelector('span:not(.count)');
    const sectionId = h.parentElement.id || h.textContent;
    // Match by text content
    const isCollapsed = collapsed.some(c => sectionId.includes(c) || h.textContent.includes(c));
    if (isCollapsed) {
      h.classList.add('collapsed');
      const body = h.nextElementSibling;
      if (body && body.classList.contains('section-body')) body.classList.add('collapsed');
    }
  });
}

// ── Live uptime ticker ───────────────────────────────────────────

let uptimeTickInterval = null;
let tickHealthCache = {};

function startUptimeTicker() {
  // Snapshot health at ticker start
  tickHealthCache = {};
  Object.keys(healthCache).forEach(k => { tickHealthCache[k] = { ...healthCache[k] }; });
  if (uptimeTickInterval) clearInterval(uptimeTickInterval);
  uptimeTickInterval = setInterval(() => {
    // Sync from current healthCache (updated by fetchAll)
    Object.keys(healthCache).forEach(k => {
      if (!tickHealthCache[k]) tickHealthCache[k] = { ...healthCache[k] };
      if (healthCache[k].status === 'up' || healthCache[k].status === 'warning') {
        tickHealthCache[k].uptime_s = (tickHealthCache[k].uptime_s || 0) + 1;
      }
    });
    // Update DOM directly without re-fetch
    document.querySelectorAll('.card').forEach(card => {
      const toolId = card.id.replace('card-', '');
      const h = tickHealthCache[toolId];
      if (!h || h.status === 'down') return;
      const metaItems = card.querySelectorAll('.meta-item');
      if (metaItems[3]) { // Uptime is 4th meta-item (0-indexed: 3)
        const el = metaItems[3].querySelector('.meta-value');
        if (el) {
          const display = fmtUptime(h.uptime_s);
          if (el.textContent !== display) el.textContent = display;
        }
      }
    });
  }, 1000);
}

// ── Init ─────────────────────────────────────────────────────────

fetchAll().then(() => {
  startUptimeTicker();
  // 30s auto-refresh
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(fetchAll, 30000);
});
</script>
</body>
</html>
